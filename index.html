
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f7f0">
<meta name="description" content="EIRA BLOOM Beauty & Nail Salon — Al Ain, UAE. Connect with us on WhatsApp, Instagram and Snapchat.">
<title>EIRA BLOOM | Beauty & Nail Salon</title>

<style>
:root{
  --green:#004735;
  --brown:#B89B72;
  --cream:#f8f6ee;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f2f0e9;
  color:#153b30;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 12px;
}

.card{
  width:min(100%,480px);
  background:var(--cream);
  border:1.5px solid var(--brown);
  border-radius:36px;
  box-shadow:0 8px 35px #203a2c16;
  overflow:hidden;
  text-align:center;
  padding:38px 22px 0;
}

.logo{
  display:block;
  width:100%;
  max-width:420px;
  height:auto;
  margin:0 auto 18px;
}

.rule{
  height:1px;
  background:var(--brown);
  width:110px;
  margin:0 auto 22px;
}

.tagline{
  font-family:Georgia,serif;
  font-size:18px;
  margin:0 0 27px;
  line-height:1.4;
}

.links{
  display:grid;
  gap:12px;
}

.link{
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  border-radius:17px;
  padding:12px 17px;
  text-decoration:none;
  text-align:left;
  font-size:clamp(14px,3.9vw,18px);
  font-weight:700;
  box-shadow:0 2px 4px #00271d22;
  transition:transform .15s,background .15s;
}

.link:hover,
.link:focus-visible{
  background:#11614b;
  transform:translateY(-2px);
}

.symbol{
  width:38px;
  flex:none;
  text-align:center;
  font-size:22px;
  border-right:1px solid var(--brown);
  padding-right:10px;
}

.label{flex:1}

.arrow{
  font-size:23px;
  font-weight:400;
}

.footer{
  margin:35px 0 25px;
  letter-spacing:5px;
  font-size:15px;
}

.waves{
  height:47px;
  margin:0 -22px;
  background:linear-gradient(
    165deg,
    transparent 0 45%,
    var(--brown) 46% 49%,
    var(--green) 50% 75%,
    var(--brown) 76% 84%,
    var(--green) 85%
  );
}

@media(max-width:370px){
  .card{
    padding-left:14px;
    padding-right:14px;
  }
  .waves{margin:0 -14px}
  .link{padding:10px}
  .symbol{width:30px}
}
</style>
</head>

<body>
<main class="card">

<img class="logo"
     src="logo.png"
     alt="صالون إيرا بلوم — EIRA BLOOM BEAUTY & NAIL SALON">

<div class="rule"></div>

<p class="tagline">
Beauty, care &amp; connection — find us here
</p>

<nav class="links" aria-label="Contact and social links">

<a class="link" href="https://wa.me/971502477614" target="_blank" rel="noopener noreferrer">
<span class="symbol">✆</span>
<span class="label">WhatsApp · 050 247 7614</span>
<span class="arrow">↗</span>
</a>

<a class="link" href="https://wa.me/971545112115" target="_blank" rel="noopener noreferrer">
<span class="symbol">✆</span>
<span class="label">WhatsApp · 054 511 2115</span>
<span class="arrow">↗</span>
</a>

<a class="link" href="https://www.instagram.com/eirabloom2026/" target="_blank" rel="noopener noreferrer">
<span class="symbol">◎</span>
<span class="label">Instagram · EIRA BLOOM</span>
<span class="arrow">↗</span>
</a>

<a class="link" href="https://www.instagram.com/hayat33_hairstyle/" target="_blank" rel="noopener noreferrer">
<span class="symbol">◎</span>
<span class="label">Instagram · Hayat Hairstylist</span>
<span class="arrow">↗</span>
</a>

<a class="link" href="https://www.snapchat.com/add/hairstyle-33" target="_blank" rel="noopener noreferrer">
<span class="symbol">◉</span>
<span class="label">Snapchat · hairstyle-33</span>
<span class="arrow">↗</span>
</a>

</nav>

<div class="footer">AL AIN · UAE</div>
<div class="waves" aria-hidden="true"></div>

</main>
</body>
</html>
